<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>MR.MOO Dashboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #101216; color: #e8eaed;
    font: 14px/1.5 "Segoe UI", Sarabun, system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center;
    gap: 12px; padding: 14px 20px; background: #16181c; border-bottom: 1px solid #2c2f36; }
  header h1 { font-size: 16px; margin: 0; }
  header .sp { flex: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #6b7280; }
  .dot.on { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  button { padding: 7px 12px; border-radius: 8px; border: 1px solid #333842;
    background: #252a33; color: #e8eaed; cursor: pointer; font: inherit; font-weight: 600; }
  button:hover { background: #2f3542; }
  button.danger { background: #7f1d1d; border-color: #7f1d1d; }
  main { padding: 20px; max-width: 1400px; margin: 0 auto; }
  h2 { font-size: 12px; color: #9aa0a6; text-transform: uppercase;
    letter-spacing: .05em; margin: 0 0 10px; }
  section { margin-bottom: 28px; }

  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px; margin-bottom: 24px; }
  .totals div { background: #16181c; border: 1px solid #23262c; border-radius: 12px;
    padding: 12px 14px; }
  .totals b { display: block; font-size: 24px; line-height: 1.2; }
  .totals span { font-size: 11px; color: #9aa0a6; }

  .bots { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .bot { background: #16181c; border: 1px solid #23262c; border-radius: 12px; padding: 14px; }
  .bot.on { border-color: #1a5c3a; }
  .bot.dead { border-color: #7f1d1d; opacity: .75; }
  .bot .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .bot .name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .bot a.grp { color: #60a5fa; text-decoration: none; font-size: 11px; }
  .bot a.grp:hover { text-decoration: underline; }
  .bot .st { font-size: 12px; color: #facc15; margin-bottom: 10px; }
  .bot .st.run { color: #4ade80; }
  .bot .st.dead { color: #f87171; }
  .bot .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    text-align: center; margin-bottom: 8px; }
  .bot .grid div { background: #1b1e24; border-radius: 8px; padding: 5px 2px; }
  .bot .grid b { display: block; font-size: 14px; }
  .bot .grid span { font-size: 10px; color: #9aa0a6; }
  .bot .meta { font-size: 11px; color: #6b7280; display: flex; justify-content: space-between; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; color: #9aa0a6; font-weight: 600;
    padding: 8px 10px; border-bottom: 1px solid #23262c; text-transform: uppercase; }
  td { padding: 9px 10px; border-bottom: 1px solid #1b1e24; vertical-align: top; }
  tr:hover td { background: #16181c; }
  td.t { color: #6b7280; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; }
  .tag.comment { background: #0f2018; color: #6ee7b7; }
  .tag.post { background: #101f2e; color: #7dd3fc; }
  .tag.error { background: #2a1010; color: #fca5a5; }
  td a { color: #60a5fa; text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .snip { color: #c3c7cc; max-width: 460px; overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .empty { color: #6b7280; padding: 24px; text-align: center;
    border: 1px dashed #23262c; border-radius: 12px; }
  .note { font-size: 12px; color: #6b7280; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="live"></span>
  <h1>MR.MOO Dashboard</h1>
  <span id="clock" class="note"></span>
  <span class="sp"></span>
  <button id="btn-refresh">รีเฟรช</button>
  <button class="danger" id="btn-stopall">หยุดทุกตัว</button>
  <button id="btn-clear">ล้างประวัติ</button>
</header>

<main>
  <div class="totals" id="totals"></div>

  <section>
    <h2>บอทที่กำลังทำงาน</h2>
    <div class="bots" id="bots"></div>
  </section>

  <section>
    <h2>ประวัติการคอมเมนต์และโพสต์</h2>
    <table id="events">
      <thead>
        <tr>
          <th style="width:88px">เวลา</th>
          <th style="width:96px">ประเภท</th>
          <th style="width:170px">กลุ่ม</th>
          <th>รายละเอียด</th>
          <th style="width:80px">ลิงก์</th>
        </tr>
      </thead>
      <tbody id="evbody"></tbody>
    </table>
    <div class="note">
      หน้านี้อ่านข้อมูลจากเครื่องนี้เท่านั้น ถ้าอยากดูจากมือถือหรือเครื่องอื่น
      ให้ตั้ง webhook ในหน้าตั้งค่า แล้วเหตุการณ์จะถูกส่งไปที่นั่นด้วย
    </div>
  </section>
</main>

<script src="dashboard.js"></script>
</body>
</html>
